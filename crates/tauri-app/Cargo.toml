[package]
name = "cdash-tauri"
version = "0.9.0"
edition = "2021"

# Android loads the app as a shared object, so the code lives in a lib target;
# `cdylib` is what the generated Kotlin activity loads, `rlib` is what
# `src/main.rs` and the tests link.
[lib]
name = "cdash_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# One destination, http://127.0.0.1:<port>, redirects disabled: no TLS, no h2.
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }

# Two platforms link no agent, for the same reason: what the agent drives —
# tmux, `claude`, /proc — lives somewhere else on them. On Windows that is a
# WSL distro, reached over WSL2's loopback relay; on Android it is Termux,
# reached over loopback, which Android does not isolate between apps. Keep this
# in step with `inproc_agent` in build.rs.
[target.'cfg(all(not(windows), not(target_os = "android")))'.dependencies]
cdash-agent = { path = "../agent" }

# Desktop system notifications. 2.6+ needs tauri ^2.12.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-notification = "2.6"
# The watcher sleeps between reconnects; tauri's runtime is tokio but does not re-export `time`.
tokio = { version = "1", features = ["time"] }

# Android notifications: a foreground service holding the agent's note stream.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-cdash-watch = { path = "../tauri-plugin-cdash-watch" }

# "test" only unifies into dev/test builds; release binaries never see it.
# The test-only tokio features (runtime, macros) live here; the desktop
# dependency above adds `time` for the notification watcher.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
