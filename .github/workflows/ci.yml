name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    # Ceiling for a hang. Without it, a stuck test run holds the job for
    # GitHub's six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The test flags in package.json need Node 22, the version the suite was
      # verified on. Pin it instead of taking the runner's default.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy
      # cdash-tauri links webkit2gtk and libappindicator; ubuntu-latest ships
      # neither, so without this `--all` dies in a build script before a single
      # test runs.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev tmux
      - run: npm test
      - run: cargo test --all --locked
      - run: cargo clippy --all-targets --locked -- -D warnings -D clippy::disallowed_types

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        env:
          CF_TEAM_DOMAIN: https://example.cloudflareaccess.com
          CF_AUD: smoke-audience
          TUNNEL_TOKEN: smoke-token
        run: docker compose config --quiet
      - name: Build agent and check project-data exclusion
        run: |
          mkdir -p projects
          printf 'not a build input\n' > projects/context-marker
          docker build --target build -t rc-dashboard:build-test .
          docker run --rm --entrypoint /bin/sh rc-dashboard:build-test -ec 'test ! -e /src/projects'
      - name: Build and test runtime image
        run: |
          docker build -t rc-dashboard:ci .
          bash scripts/test-docker.sh rc-dashboard:ci
      - name: Rebuild after a source change
        run: |
          printf '\n' >> crates/agent/src/main.rs
          docker build -t rc-dashboard:ci .
          bash scripts/test-docker.sh rc-dashboard:ci

  publish:
    # ponytail: rebuilds the image; cache mounts do not persist, so reusing the
    # docker job's image needs an artifact. Add it if release time matters.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build release image
        run: docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
      - name: Smoke-test the image about to be pushed
        run: bash scripts/test-docker.sh "$IMAGE:$VERSION"
      - name: Push to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

  release-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      # aws-lc-sys needs a musl C cross-compiler, which Ubuntu does not package.
      # This action supplies one and registers a qemu-user runner, replacing a
      # hand-rolled fetch from musl.cc — a host that has since stopped
      # responding and took every release build down with it.
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - run: cargo build --release --locked -p cdash-agent
      # Building is not the gate; booting is. `cargo run` goes through the
      # runner the action registered, so aarch64 executes under qemu here.
      # timeout's 124 means it served until killed, which is the pass — so
      # assert on the banner instead of the exit status.
      - name: Execute the binary
        run: |
          PORT=0 timeout 5 cargo run --release --locked -p cdash-agent > boot.log 2>&1 || true
          cat boot.log
          grep -q "cdash-agent .* on http://127.0.0.1:" boot.log
      - uses: actions/upload-artifact@v4
        with:
          name: cdash-agent-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/cdash-agent
