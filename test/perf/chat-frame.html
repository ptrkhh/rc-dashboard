<!doctype html>
<meta charset="utf-8">
<title>chat frame time</title>
<!-- Frame-time measurement for the spec's Performance table (Part 4, Task 23).
     Serve the repo root (python3 -m http.server 8765) and open
     /test/perf/chat-frame.html; with Chrome's CPU throttled 4x the page prints
     the median and p95 render time for 200 state frames over ~2,000 rows, and
     puts the same line in document.title. ?n=<frames> changes the history size.
     All script is inline: node --test runs every .js file under test/. -->
<link rel="stylesheet" href="../../public/style.css">
<body class="chat-open">
<div id="chat" class="chat" hidden>
  <div class="chat-bar">
    <button id="chat-close" class="icon-btn" type="button" aria-label="Close chat"></button>
    <div class="chat-heading">
      <span id="chat-title" class="chat-title"></span>
      <span id="chat-state" class="chat-state" role="status" aria-live="polite"></span>
    </div>
    <button id="chat-term" class="chat-bar-btn" type="button" aria-label="Terminal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17l6-5-6-5"/><path d="M12 19h8"/></svg><span class="chat-bar-label">Terminal</span></button>
    <a id="chat-rc" class="chat-bar-btn" target="_blank" rel="noopener noreferrer" aria-label="Open in Claude" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg><span class="chat-bar-label">Open in Claude</span></a>
  </div>
  <div id="chat-banner" class="chat-banner" role="status" hidden></div>
  <div id="chat-log" class="chat-log" aria-live="polite"></div>
  <button id="chat-jump" class="chat-jump" type="button" hidden>Jump to latest</button>
  <div id="chat-held" class="chat-held"></div>
  <form id="chat-form" class="chat-form">
    <textarea id="chat-input" rows="1" placeholder="Message…" aria-label="Message"></textarea>
    <button id="chat-go" class="chat-go" type="submit">Send</button>
  </form>
</div>
<dialog id="chat-sheet" class="dialog" aria-label="Tool details">
  <div class="dialog-body">
    <div class="dialog-head">
      <span id="chat-sheet-title" class="dialog-title">Details</span>
      <button id="chat-sheet-close" class="icon-btn" type="button" aria-label="Close details">×</button>
    </div>
    <div id="chat-sheet-body" class="chat-sheet-body"></div>
  </div>
</dialog>
<pre id="out" style="position:fixed;right:0;top:0;z-index:99;background:#fff;color:#000;margin:0;padding:4px">running…</pre>
<script src="../../public/chat/md.js"></script>
<script src="../../public/chat/store.js"></script>
<script src="../../public/chat/view.js"></script>
<script>
(async () => {
  const N = +new URLSearchParams(location.search).get('n') || 2667; // 4 frames make 3 rows: ~2,000 rows
  const times = [];
  let timing = false;
  const raf = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = cb => raf(ts => {
    const t0 = performance.now();
    cb(ts);
    if (timing) times.push(performance.now() - t0);
  });

  // The agent, replaced: hello, N events of mixed rows, a state; then 200 more states.
  let sock;
  window.WebSocket = class {
    constructor() { sock = this; this.readyState = 1; setTimeout(() => this.onopen?.(), 0); }
    send() {}
    close() { this.readyState = 3; }
  };
  WebSocket.OPEN = 1;
  const push = f => sock.onmessage({ data: JSON.stringify(f) });
  const text = 'word '.repeat(80); // 400 characters
  const ev = (seq) => {
    const k = seq % 4;
    if (k === 0) return { type: 'user', uuid: 'u' + seq, message: { role: 'user', content: 'a prompt of about eighty characters, give or take a few more or less: ' + seq } };
    if (k === 1) return { type: 'assistant', uuid: 'k' + seq, message: { id: 'm' + seq, role: 'assistant', content: [{ type: 'tool_use', id: 't' + seq, name: 'Bash', input: { command: 'npm test -- --grep ' + seq } }] } };
    if (k === 2) return { type: 'user', uuid: 'r' + seq, message: { role: 'user', content: [{ type: 'tool_result', tool_use_id: 't' + (seq - 1), content: 'ok '.repeat(300), is_error: false }] } };
    return { type: 'assistant', uuid: 'k' + seq, message: { id: 'm' + seq, role: 'assistant', content: [{ type: 'text', text: '**Result ' + seq + '** ' + text }] } };
  };

  cdashChat.open({ name: 'cdash-perf', title: 'perf', wsUrl: async () => 'ws://fake', toast() {}, openTerm() {} });
  await new Promise(r => setTimeout(r, 50));
  push({ t: 'hello', epoch: 'e1', first: 1, tool: 'claude' });
  for (let seq = 1; seq <= N; seq++) push({ t: 'ev', seq, ev: ev(seq) });
  push({ t: 'state', working: false, waiting: false, held: [] });
  await new Promise(r => setTimeout(r, 1000)); // the first render, with every row built
  const rows = document.querySelectorAll('#chat-log > *').length;
  timing = true;
  for (let i = 0; i < 200; i++) {
    push({ t: 'state', working: i % 2 === 0, waiting: false, held: [] });
    await new Promise(r => setTimeout(r, 50));
  }
  await new Promise(r => setTimeout(r, 200));
  timing = false;
  const s = [...times].sort((a, b) => a - b);
  const q = p => s[Math.min(s.length - 1, Math.floor(s.length * p))].toFixed(2);
  const line = `rows ${rows}, frames ${s.length}, median ${q(0.5)} ms, p95 ${q(0.95)} ms`;
  document.getElementById('out').textContent = line;
  document.title = 'done ' + line;
})();
</script>
